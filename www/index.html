<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppStudio Compiler</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; padding: 15px; background: #0d1117; color: #c9d1d9; margin: 0; }
    h3 { margin-top: 0; color: #58a6ff; }
    textarea { width: 100%; height: 300px; background: #161b22; color: #7ee787; font-family: monospace; border: 1px solid #30363d; padding: 12px; border-radius: 6px; font-size: 14px; }
    button { width: 100%; padding: 14px; background: #238636; color: white; border: none; margin-top: 12px; font-weight: bold; border-radius: 6px; font-size: 16px; }
    button:disabled { background: #21262d; color: #484f58; }
    #console { margin-top: 15px; padding: 12px; border-radius: 6px; background: #161b22; border: 1px solid #30363d; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
    .success { border-color: #238636 !important; color: #7ee787; }
    .error { border-color: #da3633 !important; color: #f85149; }
    a.btn-dl { display: block; text-align: center; background: #1f6beb; color: white; text-decoration: none; padding: 14px; margin-top: 12px; border-radius: 6px; font-weight: bold; }
  </style>
</head>
<body>

  <h3>AppStudio Builder</h3>
  <textarea id="appScript">// Write your custom JS logic here
document.addEventListener('deviceready', function() {
    alert('App compiled successfully!');
}, false);</textarea>

  <button id="buildBtn" onclick="startBuildProcess()">COMPILE APK</button>

  <div id="console">Ready. Click Compile to submit build.</div>
  <div id="downloadArea"></div>

  <script>
    const CONFIG = {
      username: "yukee520",
      repo: "AppStudio-Engine",
      token: "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"
    };

    let pollInterval = null;

    async function startBuildProcess() {
      const consoleBox = document.getElementById('console');
      const buildBtn = document.getElementById('buildBtn');
      const downloadArea = document.getElementById('downloadArea');
      const scriptContent = document.getElementById('appScript').value;

      buildBtn.disabled = true;
      downloadArea.innerHTML = "";
      consoleBox.className = "";
      consoleBox.innerText = "⏳ Connecting to GitHub API...";

      try {
        const response = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/dispatches`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${CONFIG.token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            event_type: 'build_apk',
            client_payload: { script: scriptContent }
          })
        });

        if (response.ok || response.status === 204) {
          consoleBox.innerText = "✅ Dispatch accepted!\n⏳ GitHub runner active... Building APK (~2 mins)...";
          pollWorkflowStatus();
        } else {
          throw new Error(`Auth Failed (Status ${response.status})`);
        }
      } catch (err) {
        consoleBox.className = "error";
        consoleBox.innerText = "❌ Error: " + err.message;
        buildBtn.disabled = false;
      }
    }

    async function pollWorkflowStatus() {
      const consoleBox = document.getElementById('console');
      const buildBtn = document.getElementById('buildBtn');
      const downloadArea = document.getElementById('downloadArea');

      pollInterval = setInterval(async () => {
        try {
          const runsRes = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/actions/runs?per_page=1`, {
            headers: { 'Authorization': `Bearer ${CONFIG.token}` }
          });
          const runsData = await runsRes.json();
          const latestRun = runsData.workflow_runs[0];

          if (!latestRun) return;

          if (latestRun.status === "in_progress" || latestRun.status === "queued") {
            consoleBox.innerText = `⏳ Cloud Runner Status: ${latestRun.status.toUpperCase()}\nCompiling Java/Android dependencies...`;
          } 
          else if (latestRun.status === "completed") {
            clearInterval(pollInterval);
            buildBtn.disabled = false;

            if (latestRun.conclusion === "success") {
              consoleBox.className = "success";
              consoleBox.innerText = "🎉 APK Compilation Successful!";
              const runUrl = `https://github.com/${CONFIG.username}/${CONFIG.repo}/actions/runs/${latestRun.id}`;
              downloadArea.innerHTML = `<a href="${runUrl}" target="_blank" class="btn-dl">📥 DOWNLOAD GENERATED APK</a>`;
            } else {
              consoleBox.className = "error";
              consoleBox.innerText = `❌ BUILD FAILED\n\nLogs: https://github.com/${CONFIG.username}/${CONFIG.repo}/actions/runs/${latestRun.id}`;
            }
          }
        } catch (err) {}
      }, 10000);
    }
  </script>
</body>
</html>
