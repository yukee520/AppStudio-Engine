name: AppStudio Remote Compiler Engine

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Inject Custom App Script & Config
        run: |
          # Create a fresh app build output folder
          cordova create custom_build com.user.customapp "CustomApp"
          cd custom_build
          cordova platform add android
          
          # Inject user submitted script into www/index.html
          cat << 'HTMLEOF' > www/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Custom App</title>
            <script src="cordova.js"></script>
          </head>
          <body>
            <script>
            ${{ github.event.client_payload.script }}
            </script>
          </body>
          </html>
          HTMLEOF

          # Compile the standalone custom APK
          cordova build android --debug

      - name: Upload Custom App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomApp-Release
          path: custom_build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
