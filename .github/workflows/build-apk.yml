name: AppStudio Remote Compiler Engine

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Custom App
        env:
          USER_SCRIPT: ${{ github.event.client_payload.script }}
        run: |
          # 1. Create temporary Cordova project
          cordova create custom_build com.user.customapp "CustomApp"
          cd custom_build
          cordova platform add android
          
          # 2. Safely write user script via Node.js to avoid shell escapes
          node -e '
            const fs = require("fs");
            const script = process.env.USER_SCRIPT || "";
            const htmlContent = `<!DOCTYPE html>
          <html>
          <head>
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Custom App</title>
            <script src="cordova.js"></script>
          </head>
          <body>
            <script>
            ${script}
            </script>
          </body>
          </html>`;
            fs.writeFileSync("www/index.html", htmlContent);
          '

          # 3. Build Android Debug APK
          cordova build android --debug

      - name: Upload Custom App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomApp-Release
          path: custom_build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
