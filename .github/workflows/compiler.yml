name: AppStudio Remote Compiler Engine

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Custom App
        env:
          USER_SCRIPT: ${{ github.event.client_payload.script }}
          APP_NAME: ${{ github.event.client_payload.app_name || 'GeneratedApp' }}
          APP_ID: ${{ github.event.client_payload.app_id || 'com.appstudio.generated' }}
        run: |
          # 1. Create project with dynamic ID and dynamic Name
          cordova create custom_build "$APP_ID" "$APP_NAME"
          cd custom_build
          cordova platform add android

          # 2. Inject React UMD runtime and raw User Script
          node -e '
            const fs = require("fs");
            const script = process.env.USER_SCRIPT || "";
            const appName = process.env.APP_NAME || "Custom App";
            const htmlContent = `<!DOCTYPE html>
          <html>
          <head>
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>${appName}</title>
            <script src="cordova.js"></script>
            <!-- Load React & Babel for dynamic JS/JSX rendering -->
            <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
            <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
            <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
            <style>
              body { margin: 0; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
              #root { width: 100%; height: 100vh; }
            </style>
          </head>
          <body>
            <div id="root"></div>
            <script type="text/babel">
              document.addEventListener("deviceready", function() {
                try {
                  ${script}
                } catch(err) {
                  document.getElementById("root").innerHTML = "<pre style=\"color:red;\">" + err.toString() + "</pre>";
                }
              }, false);
            </script>
          </body>
          </html>`;
            fs.writeFileSync("www/index.html", htmlContent);
          '

          # 3. Build Android Debug APK
          cordova build android --debug

      - name: Upload Custom App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomApp-Release
          path: "**/app-debug.apk"
