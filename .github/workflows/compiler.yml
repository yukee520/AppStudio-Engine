name: AppStudio Remote Compiler Engine

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build App Project
        env:
          APP_NAME: ${{ github.event.client_payload.app_name || 'My App' }}
          APP_ID: ${{ github.event.client_payload.app_id || 'com.appstudio.customapp' }}
          USER_HTML: ${{ github.event.client_payload.html }}
          USER_JS: ${{ github.event.client_payload.js }}
          USER_CSS: ${{ github.event.client_payload.css }}
        run: |
          # 1. Initialize fresh preset template with dynamic metadata
          cordova create custom_project "$APP_ID" "$APP_NAME"
          cd custom_project
          cordova platform add android

          # 2. Populate project file directory (www/ folder) via Node.js
          node -e '
            const fs = require("fs");
            
            const html = process.env.USER_HTML || "<h1>Default App Studio Screen</h1>";
            const js = process.env.USER_JS || "console.log(\"App initialized\");";
            const css = process.env.USER_CSS || "body { font-family: sans-serif; padding: 20px; }";
            const appName = process.env.APP_NAME || "My App";

            // Full index.html embedding user CSS and JS imports
            const fullHtml = `<!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>${appName}</title>
            <link rel="stylesheet" href="style.css">
            <script src="cordova.js"></script>
          </head>
          <body>
            ${html}
            <script src="app.js"></script>
          </body>
          </html>`;

            fs.writeFileSync("www/index.html", fullHtml);
            fs.writeFileSync("www/app.js", js);
            fs.writeFileSync("www/style.css", css);
          '

          # 3. Compile project to Android Debug APK
          cordova build android --debug

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomApp-Release
          path: "**/app-debug.apk"
